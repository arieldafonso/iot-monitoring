services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: harryspace-mqtt
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  influxdb:
    image: influxdb:1.8
    container_name: harryspace-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: harryspace
      INFLUXDB_USER: user
      INFLUXDB_USER_PASSWORD: password
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:10.4.2
    container_name: harryspace-grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bridge:
    build: .
    container_name: harryspace-bridge
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      INFLUX_HOST: influxdb
      INFLUX_PORT: "8086"
      INFLUX_DB: harryspace
      INFLUX_USER: user
      INFLUX_PASSWORD: password
    depends_on:
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  ping-monitor:
    build:
      context: .
      dockerfile: Dockerfile.ping
    container_name: harryspace-ping
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      SWITCH_IP: "192.168.1.1"
      LOCATION: "01"
      PING_INTERVAL: "5"
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
